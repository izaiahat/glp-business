name: guardian-coordinator-ci
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/guardian-coordinator-ci.yml"
      - "ops/hermes-cron-scripts/cgroup_headroom_guardian.py"
      - "tests/conftest.py"
      - "tests/test_cgroup_headroom_guardian.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guardian-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install isolated runner
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5'
      - name: Coordinator and OOM safety regressions (offline, no activation)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_cgroup_headroom_guardian.py
