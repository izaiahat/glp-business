name: glp110-maintenance-window
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/hermes_maintenance_window.py
      - tests/test_hermes_maintenance_window.py
      - .github/workflows/glp110-maintenance-window.yml
permissions:
  contents: read
concurrency:
  group: glp110-maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-maintenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact head, scratch-only backup and lifecycle regressions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'MAINTENANCE_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 -B -m unittest discover -s tests -p test_hermes_maintenance_window.py -v
