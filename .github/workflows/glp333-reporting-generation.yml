name: glp333-reporting-generation
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/glp333-reporting-generation.yml"
      - "ops/discord_fmt.py"
      - "ops/glp/analytics-brain-control.json"
      - "ops/glp/reporting-v2/**"
      - "ops/glp333-*/**"
      - "ops/hermes-cron-scripts/glp_affiliate_weekly_reporting.sh"
      - "ops/n8n-bridge/actions.json"
      - "scripts/.retired-20260925/fastmode_revert.py"
      - "scripts/affiliate_best_terms_machine.py"
      - "scripts/affiliate_network_access.py"
      - "scripts/affiliate_payout_policy.py"
      - "scripts/affiliate_program_relevance.py"
      - "scripts/affiliate_provider_metadata.py"
      - "scripts/affiliate_provider_row_scope.py"
      - "scripts/affiliate_reporting_admitad.py"
      - "scripts/affiliate_reporting_clickbank.py"
      - "scripts/affiliate_reporting_everflow.py"
      - "scripts/affiliate_reporting_healthtrader.py"
      - "scripts/affiliate_reporting_partnerstack.py"
      - "scripts/affiliate_reporting_refersion.py"
      - "scripts/affiliate_sheet_batch_writer.py"
      - "scripts/affiliate_sheet_schema_guard.py"
      - "scripts/cron_bridge_action.py"
      - "scripts/fleet_pin_release.py"
      - "scripts/glp331_carrier_adoption.py"
      - "scripts/glp345_a4_adoption.py"
      - "scripts/glp44_commit_recovery.py"
      - "scripts/glp44_scoped_adoption.py"
      - "scripts/glp73_paired_adoption.py"
      - "scripts/glp_affiliate_link_rails.py"
      - "scripts/glp_affiliate_weekly_reporting.py"
      - "scripts/glp_affiliate_weekly_reporting_job.py"
      - "scripts/glp_affiliate_wire_backlog_worker.py"
      - "scripts/glp_analytics_brain_cadence.py"
      - "scripts/glp_api_collectors_smoke.py"
      - "scripts/glp_current_content_base_schema.py"
      - "scripts/glp_go_runtime_manifest_refresh.mjs"
      - "scripts/glp_network_revenue_v2.py"
      - "scripts/glp_price_index_weekly.py"
      - "scripts/glp_ship_generation.py"
      - "scripts/glp_ship.py"
      - "scripts/glp_ship_attempts.py"
      - "scripts/glp_ship_provenance.py"
      - "scripts/glp_ship_registry.py"
      - "scripts/impact_api_credentials.py"
      - "scripts/maintenance_*.py"
      - "scripts/maintenance_admission.py"
      - "scripts/maintenance_cohort.py"
      - "scripts/maintenance_inventory.py"
      - "scripts/maintenance_window.py"
      - "scripts/marketplace_adapters/**"
      - "scripts/maxbounty_pin_release.py"
      - "scripts/pin_drift_report.py"
      - "scripts/site_tree_materializer.py"
      - "scripts/sync_from_repo.py"
      - "systems/analytics-brain/analytics_brain.py"
      - "systems/analytics-brain/collector.py"
      - "tests/conftest.py"
      - "tests/test_api_collectors_clickbank_healthtrader.py"
      - "tests/test_api_collectors_everflow.py"
      - "tests/test_api_collectors_partnerstack_admitad.py"
      - "tests/test_api_collectors_refersion.py"
      - "tests/test_api_collectors_smoke.py"
      - "tests/test_api_collectors_wiring.py"
      - "tests/test_f07_registered_weekly_entry.py"
      - "tests/test_glp333_glp44_current_generation.py"
      - "tests/test_glp333_reporting_generation.py"
      - "tests/test_glp44_scoped_adoption.py"
      - "tests/test_glp334_enrollment.py"
      - "tests/test_glp_ship_preclaim.py"
      - "tests/test_glp_ship_refusal_inspection.py"
      - "tests/test_glp_ship_supersession.py"
      - "tests/test_maintenance_cohort_recovery.py"
      - "tests/test_maintenance_inventory.py"
      - "tests/test_maintenance_native_admission.py"
      - "tests/test_maintenance_window.py"
      - "tests/test_pr148_reporting_followups.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reporting-generation-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest==8.3.5
      - name: Maintained window, exact reporting cohort and original PR71 regressions (offline fixtures)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts:tests:.
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_pr148_reporting_followups.py tests/test_api_collectors_partnerstack_admitad.py tests/test_api_collectors_refersion.py tests/test_api_collectors_clickbank_healthtrader.py tests/test_api_collectors_wiring.py tests/test_api_collectors_smoke.py tests/test_api_collectors_everflow.py
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp334_enrollment.py tests/test_glp_ship.py tests/test_glp_ship_publication.py tests/test_glp_ship_preclaim.py tests/test_glp_ship_refusal_inspection.py tests/test_glp_ship_supersession.py
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_f07_registered_weekly_entry.py tests/test_glp333_reporting_generation.py tests/test_glp333_glp44_current_generation.py tests/test_glp44_scoped_adoption.py tests/test_maintenance_inventory.py tests/test_maintenance_window.py tests/test_maintenance_native_admission.py tests/test_maintenance_cohort_recovery.py
