name: glp333-reporting-generation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reporting-generation-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest==8.3.5
      - name: Maintained window, exact reporting cohort and original PR71 regressions (offline fixtures)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts:tests:.
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # Diagnostic-only disposable copy: no maintained source/oracle edits.
          export DIAG_ROOT="$RUNNER_TEMP/maintenance-exit-diagnostic"
          git clone --shared "$PWD" "$DIAG_ROOT"
          git -C "$DIAG_ROOT" checkout --detach 04b1c9ed238a6ff77ee4c54133d39998ec16328d
          .venv/bin/python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['DIAG_ROOT'])
          source = root / 'scripts/maintenance_window.py'
          text = source.read_text()
          needle = "    except Exception as exc:\n        failure = {'status': 'REFUSED'"
          insertion = "    except Exception as exc:\n        import traceback\n        traceback.print_exc()\n        print('DIAG_ORIGIN', __file__, main.__code__.co_filename, file=sys.stderr)\n        tb = exc.__traceback__\n        while tb:\n            frame = tb.tb_frame\n            print('DIAG_FRAME', frame.f_code.co_name, tb.tb_lineno, {k: repr(v) for k,v in frame.f_locals.items() if k in ('result', 'keeper_exit_requested', 'timeout', 'handle', 'remaining', 'path')}, file=sys.stderr)\n            tb = tb.tb_next\n        failure = {'status': 'REFUSED'"
          assert text.count(needle) == 1
          instrumented = text.replace(needle, insertion)
          busy = "                    raise WindowError('window_operation_busy') from exc"
          assert instrumented.count(busy) == 1
          instrumented = instrumented.replace(busy, "                    print('DIAG_BUSY', os.readlink('/proc/self/fd/' + str(handle)), os.fstat(handle).st_dev, os.fstat(handle).st_ino, read_journal(journal), file=sys.stderr)\n" + busy)
          source.write_text(instrumented)
          manifest = root / 'ops/rebuild-source-manifest.json'
          data = json.loads(manifest.read_text())
          data['files']['scripts/maintenance_window.py']['sha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          print('DIAG_SOURCE', source, hashlib.sha256(text.encode()).hexdigest())
          PY
          PYTHON="$PWD/.venv/bin/python"
          cd "$DIAG_ROOT"
          "$PYTHON" -m pytest -q -p no:cacheprovider tests/test_glp333_reporting_generation.py tests/test_glp44_scoped_adoption.py tests/test_maintenance_inventory.py tests/test_maintenance_window.py tests/test_maintenance_native_admission.py tests/test_maintenance_cohort_recovery.py
