name: SEO updater stdout diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/glp_seo_updater_run.py
      - tests/test_seo_updater_child_diagnostic.py
      - .github/workflows/seo-updater-diagnostics.yml
permissions:
  contents: read
jobs:
  exact-head-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -B -m unittest tests.test_seo_updater_child_diagnostic -v
