      - "scripts/affiliate_provider_row_scope.py"
      - "scripts/affiliate_reporting_admitad.py"
      - "scripts/affiliate_reporting_clickbank.py"
      - "scripts/affiliate_reporting_everflow.py"
      - "scripts/affiliate_reporting_healthtrader.py"
      - "scripts/affiliate_reporting_partnerstack.py"
      - "scripts/affiliate_reporting_refersion.py"
      - "scripts/affiliate_sheet_batch_writer.py"
      - "scripts/affiliate_sheet_schema_guard.py"
      - "scripts/brief_model_effort.py"
      - "scripts/cron_bridge_action.py"
      - "scripts/fable_bridge.py"
      - "scripts/fleet_pin_release.py"
      - "scripts/glp331_carrier_adoption.py"
      - "scripts/glp345_a4_adoption.py"
      - "scripts/glp44_scoped_adoption.py"
      - "scripts/glp73_paired_adoption.py"
      - "scripts/glp_affiliate_link_rails.py"
      - "scripts/glp_affiliate_weekly_reporting.py"
      - "scripts/glp_affiliate_weekly_reporting_job.py"
      - "scripts/glp_affiliate_wire_backlog_worker.py"
      - "scripts/glp_analytics_brain_cadence.py"
      - "scripts/glp_go_runtime_manifest_refresh.mjs"
      - "scripts/glp_network_revenue_v2.py"
      - "scripts/glp_ship_generation.py"
      - "scripts/glp_ship_provenance.py"
      - "scripts/glp_ship_registry.py"
      - "scripts/glp_weekly_seo_analysis.py"
      - "scripts/glp_weekly_seo_collect.py"
      - "scripts/maintenance_cohort.py"
      - "scripts/maintenance_inventory.py"
      - "scripts/maintenance_window.py"
      - "scripts/marketplace_adapters/__init__.py"
      - "scripts/marketplace_adapters/_base.py"
      - "scripts/marketplace_adapters/katalys.py"
      - "scripts/maxbounty_pin_release.py"
      - "scripts/pin_drift_report.py"
      - "scripts/result_contract.py"
      - "scripts/run_tests.sh"
      - "scripts/seat_autodispatch.py"
      - "scripts/seat_continuation.py"
      - "scripts/site_tree_materializer.py"
      - "scripts/sync_from_repo.py"
      - "systems/analytics-brain/analytics_brain.py"
      - "systems/analytics-brain/collector.py"
      - "tests/conftest.py"
      - "tests/fixtures/glp341-a3-result.json"
      - "tests/test_fable_bridge_native_review.py"
      - "tests/test_glp333_reporting_generation.py"
      - "tests/test_glp341_weekly_adoption.py"
      - "tests/test_glp341_weekly_ads_compatibility.py"
      - "tests/test_glp345_a4_adoption.py"
      - "tests/test_sync_from_repo.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # authentic retained PR115/PR161/PR165 ancestry is exercised
          persist-credentials: false
      - name: Exact-head report compatibility (stdlib; no credentials or providers)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tests -p test_glp341_weekly_ads_compatibility.py -v
      - name: Scoped adopter regressions (no providers or live state)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_glp341_weekly_adoption.py tests/test_glp345_a4_adoption.py
