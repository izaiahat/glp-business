name: firecrawl-integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  focused-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pytest==8.3.5 requests==2.32.5 beautifulsoup4==4.13.5
          PYTHONPATH=scripts FIRECRAWL_OPERATION_LEDGER="$RUNNER_TEMP/firecrawl-fixture-ops.jsonl" python -m pytest -q tests/test_firecrawl_integration.py tests/test_firecrawl_credit_loops.py tests/test_therapeutic_taxonomy_refresh.py tests/test_glp80_taxonomy_correction.py $(git ls-files 'tests/test_firecrawl_glp350_*.py')
          git diff --exit-code
