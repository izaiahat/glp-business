name: glp345-bing-report-only-guard
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/glp345-bing-report-only-guard.yml"
      - "ops/glp/seo_data_rails.py"
      - "ops/n8n-bridge/actions.json"
      - "scripts/glp_ads_three_platform_monitor.py"
      - "tests/conftest.py"
      - "tests/test_glp_ads_three_platform_monitor.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bing-report-only-guard-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Isolated fixture runner
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5'
      - name: Unknown spend, exact binding and isolated pause readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'GLP345_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_glp_ads_three_platform_monitor.py -k microsoft
