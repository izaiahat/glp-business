name: fleet-ingest
on:
  pull_request:
    branches: [main]
    paths: ['scripts/fleet_ingest.py', 'tests/test_fleet_ingest.py', 'ops/hermes-cron-scripts/fleet_ingest_cron.sh', '.github/workflows/fleet-ingest.yml']
permissions:
  contents: read
jobs:
  offline-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Terminal adapters, read-only proofs, idempotency and stale revocation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tests -p test_fleet_ingest.py -v
          bash -n ops/hermes-cron-scripts/fleet_ingest_cron.sh
