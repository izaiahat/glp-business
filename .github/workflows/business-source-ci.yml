name: business-source-ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package-only-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: GLP73 autonomous article and Alexandria contracts (offline, exact head)
        run: |
          python3 -m unittest discover -s tests -p test_article_source_carrier.py -v
          python3 -m unittest discover -s tests -p test_glp73_autonomous_articles.py -v
          python3 -m unittest discover -s tests -p test_w10_ctr_snapshot_handoff.py -v
          python3 -m unittest discover -s tests -p test_glp73_article_research.py -v
          python3 -m unittest discover -s tests -p test_glp73_cogny_consumption.py -v
      - name: Q9 copy admission and report exclusions (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Q9_EXACT_HEAD=%s\n' "$(git rev-parse HEAD)"
          python3 -B -m unittest discover -s tests -p test_site_tree_materializer_q9.py -v
      - name: Verify exact head and package-only regressions (stdlib, no credentials)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tests -p test_glp42_package_only.py -v
          python3 -m unittest tests.test_glp43_current_release.CurrentReleaseTests.test_existing_promotion_uses_exact_cohort_predecessor_without_global_adoption tests.test_glp43_current_release.CurrentReleaseTests.test_r8_existing_promotion_native_selection_rollback_and_no_replay -v
  python-tests:
    runs-on: ubuntu-latest
    # Retain every gate: measured serial steps exceeded the old 15m cap.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The exact discovery successor is bound to the retained PR111 merge.
          # Retained pre-admission importer counterexample is read by exact SHA.
          fetch-depth: 0
          persist-credentials: false
      - name: Hermes active-work gate (offline proc/tmux fixtures, exact head; no activation)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B -m unittest discover -s tests -p test_hermes_active_work_gate.py -v
      - name: K4 n8n registry reconcile (offline, exact head)
        run: python3 -B -m unittest tests.test_n8n_workflow_registry_reconcile -v
      - name: Q7 GLP93 source-only review producer regressions (offline exact head; no acceptance or publication)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B -m unittest discover -s tests -p test_glp93_review_projection.py -v
          python3 -B -m unittest discover -s tests -p test_glp93_surface_inputs.py -v
      - name: Install isolated test runner
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5' 'requests==2.32.3' 'PyYAML==6.0.2' 'croniter==6.0.0' 'cryptography==46.0.3'
          .venv/bin/python -m pip install -r ops/rook-mcp/requirements.txt
      - name: Measured full-gate CI budget regression (offline, exact head)
        run: .venv/bin/python -m pytest -q tests/test_business_source_ci_budget.py
      - name: Q11 GLP93 capture-root regression (synthetic offline, exact head; no runtime effects)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pip install 'google-auth==2.55.1' 'google-api-python-client==2.194.0'
          .venv/bin/python -B -m unittest discover -s tests -p test_glp93_capture_roots.py -v
      - name: Pro relay root surface and terminal hydration (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_pro_root_home.py tests/test_pro_terminal_hydration.py tests/test_pro_unsent_nonchat.py tests/test_pro_route.py tests/test_pro_route_refill.py tests/test_gpt6pro_relay_binding.py
      - name: S4 weekly strategy updater adoption (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_weekly_strategy_updater_adoption.py tests/test_glp44_strategy_sync.py systems/seo-blog-machine/tests/test_learning_loop_actions.py
      - name: Host disk automatic pruner classes and registry clone retention (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config --global user.email ci@example.invalid && git config --global user.name ci
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_host_disk_auto_classes.py tests/test_host_disk_large_guards.py tests/test_host_disk_custody.py tests/test_host_disk_report_caches.py tests/test_host_disk_r2.py
      - name: GLP335 registered current-contract reconciliation (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp335_registered_current_contract.py tests/test_host_custody.py
      - name: Digital PR weekly gate prepared content base (offline, exact head; no sends)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp_digital_pr_weekly.py -k 'not cron_wrapper and not canonical_packet'  # those two read live host files
      - name: GLP109 protected two-account native custody (offline, exact head; no live writes)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_linear_ordinary_completion.py tests/test_linear_close.py tests/test_article_health_acceptance.py tests/test_article_reviewer_custody.py tests/test_native_review_prompt_binding.py tests/test_article_review_recovery.py
      - name: Sponsor persistent continuation (offline fixtures, exact head; no activation)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export PYTHONPATH="$PWD/ops:$PWD/scripts:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp_sponsor_campaign.py tests/test_glp_sponsor_continuation.py tests/test_glp_sponsor_boundary_repairs.py tests/test_glp_sponsor_postal_address.py tests/test_glp_sponsor_followup_notifications.py tests/test_glp_sponsor_unattended.py tests/test_glp_sponsor_poll_lock.py tests/test_glp_sponsor_nuimage_reply.py
      - name: GLP337 fixed shared-bridge custody (offline, exact head; no adoption)
