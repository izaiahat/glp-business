        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_pallas_relationship_ending.py tests/test_glp_affiliate_registry_sync.py tests/test_glp_paused_program_monitor.py tests/test_glp_release_main.py tests/test_glp_release_search_notify.py
      - name: MaxBounty live artifact exact-head capture regressions (offline)
