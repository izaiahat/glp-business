        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_cleanup_affiliate_copins.py tests/test_glp93_current_base_binding.py tests/test_reconciliation_b2_worker_pin.py
      - name: GLP347 exact relationship ending and editorial retention (offline)
        env:
