name: business-source-ci
on:
  push:
    branches: [feat/affiliate-loop-gaps-c09-c13]
  pull_request:
    branches: [main, fix/glp318-fresh-capacity-probe]
permissions:
  contents: read
jobs:
  package-only-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: GLP73 autonomous article and Alexandria contracts (offline, exact head)
        run: |
          python3 -m unittest discover -s tests -p test_glp73_autonomous_articles.py -v
          python3 -m unittest discover -s tests -p test_glp73_article_research.py -v
          python3 -m unittest discover -s tests -p test_glp73_cogny_consumption.py -v
      - name: Verify exact head and package-only regressions (stdlib, no credentials)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m unittest discover -s tests -p test_glp42_package_only.py -v
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The exact discovery successor is bound to the retained PR111 merge.
          # Retained pre-admission importer counterexample is read by exact SHA.
          fetch-depth: 0
          persist-credentials: false
      - name: Hermes active-work gate (offline proc/tmux fixtures, exact head; no activation)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B -m unittest discover -s tests -p test_hermes_active_work_gate.py -v
      - name: Install isolated test runner
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5' 'requests==2.32.3' 'PyYAML==6.0.2' 'croniter==6.0.0' 'cryptography==46.0.3'
          .venv/bin/python -m pip install -r ops/rook-mcp/requirements.txt
      - name: Sponsor persistent continuation (offline fixtures, exact head; no activation)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export PYTHONPATH="$PWD/ops:$PWD/scripts:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp_sponsor_campaign.py tests/test_glp_sponsor_continuation.py tests/test_glp_sponsor_boundary_repairs.py
      - name: GLP337 fixed shared-bridge custody (offline, exact head; no adoption)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export PYTHONPATH="$PWD/ops:$PWD/scripts:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp337_shared_bridge_migration.py tests/test_glp337_shared_bridge_generation.py tests/test_glp44_reader_exclusion.py
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp76_host_transport.py
      - name: GLP338 durable error intake action contract (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export PYTHONPATH="$PWD/ops:$PWD/scripts:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_cron_bridge_action.py::CronBridgeTests tests/test_glp44_bridge_source_admission.py tests/test_glp44_bridge_fence_successor.py
      - name: GLP330 retained discovery migration (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_discovery_predecessor_migration.py tests/test_sync_from_repo.py
      - name: F07 ship provenance verifier (offline fixtures, read-only; no install)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp_ship_provenance.py
      - name: Affiliate co-pin exact-head regressions (no effectful wrappers)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_cleanup_affiliate_copins.py
      - name: GLP347 exact relationship ending and editorial retention (offline)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_pallas_relationship_ending.py tests/test_glp_affiliate_registry_sync.py
      - name: MaxBounty live artifact exact-head capture regressions (offline)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_cleanup_maxbounty_capture.py
      - name: Daily source drift exact-head fixtures (no job execution)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_scheduled_source_drift.py tests/test_scheduled_job_health_carrier_release.py tests/test_f09_native_maintenance_boundary.py tests/test_f09_cutover.py
      - name: GLP-73 optional retention lanes (offline, no archive or sends)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_glp73_optional_retention_lanes.py tests/test_glp73_retention_prepared_consumer.py
      - name: GLP-73 exact-head sensor/hook contract (synthetic, effect-denied)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q tests/test_glp73_sensor_hook_source.py
      - name: GLP-73 guide capture compiler contract (offline, no refill)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_publication_date_binding.py
      - name: GLP-73 exact-head image fallback (offline synthetic pixels, no generation or publication)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pip install 'Pillow==11.3.0'
          .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_glp73_image_lineage_fallback.py systems/seo-blog-machine/tests/test_text_only_image_fallback.py
      - name: GLP-76 host transport acceptance (no network or updater execution)
        run: .venv/bin/python -m pytest -q tests/test_glp76_host_transport.py
      - name: GLP-85 CJ parent existing-account evidence mapping (offline, no financial event)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: scripts
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp85_cj_reporting_identity.py -k cj_parent_resolution_maps_only_existing_account_evidence
      - name: GLP-76 carrier calendar propagation (authentic base copy, offline)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: systems/analytics-brain:scripts
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp76_carrier_calendar.py tests/test_glp76_calendar_workflow_guard.py tests/test_glp76_material_custody.py tests/test_glp76_continuation.py tests/test_glp76_native_terminal_base.py tests/test_glp76_review_publication_date.py
      - name: GLP44 old-resident activation bootstrap (offline, no privileged calls)
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp44_safe_bridge_activation.py
      - name: Rook communication exact-head acceptance (offline, no credentials)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_rook_communication.py
      - name: Canonical inbox and affiliate decision routing (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_cleanup_inbox_reader.py tests/test_cleanup_affiliate_decisions.py tests/test_glp113_imap_sent_classification.py
      - name: Host intent and continuation custody (offline)
        run: .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_host_custody.py
      - name: GLP334 fresh receiver and retained network input contracts (offline)
        run: .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_glp334_live_reconciliation.py
      - name: GLP-320 portable cron runner test group (offline)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: systems/analytics-brain:scripts:.
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # DecisionsGraphTests requires the uncurated host-only action_items module.
          # Run the complete portable runner class, including every carrier test.
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_cron_bridge_action.py::CronBridgeTests
      - name: Curated business control tests
        run: PATH="$PWD/.venv/bin:$PATH" bash scripts/run_tests.sh
      - name: GLP44 sealed commercial obligations (offline, exact head)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider tests/test_glp44_collector_release.py tests/test_glp44_fastpath_direct.py
      - name: Analytics-brain neutral measurement contract (synthetic; no provider calls)
        run: .venv/bin/python -m pytest -q systems/analytics-brain/tests/test_expectations.py
      - name: Publication-date binding regression (no deployment)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_publication_date_binding.py
      - name: Article-buffer exact-entry hold regression (isolated fixtures)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_article_buffer.py -k registered_exact_entry_hold_states
      - name: Registered held-predecessor successor admission (isolated fixtures)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_article_successor.py
      - name: Repair rollback and no-replay regressions (isolated fixtures)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_opus_repair_rollback.py
      - name: GLP-73 builder, taxonomy fixture and review transport boundaries (synthetic only)
        run: .venv/bin/python -m pytest -q systems/seo-blog-machine/tests/test_glp73_builder_fixture_transport_fix.py
      - name: GLP-73 native-only article image boundary (offline fixtures)
        run: .venv/bin/python -m pytest -q tests/test_glp73_image_native_only.py
      - name: GLP-73 retention prepared authority consumer (effect-denied fixtures)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp73_retention_prepared_consumer.py
      - name: GLP-268 fresh per-job browser for affiliate callers (offline fakes; no browser launch)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp268_fresh_browser_callers.py tests/test_glp268_reconciler_access.py
