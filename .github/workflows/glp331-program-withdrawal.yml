name: glp331-program-withdrawal
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/glp331-program-withdrawal.yml"
      - "inbox_control_plane/__init__.py"
      - "inbox_control_plane/affiliate_decision_queue.py"
      - "inbox_control_plane/affiliate_network_registry.py"
      - "inbox_control_plane/affiliate_supply_intake.py"
      - "inbox_control_plane/approved_gmail_sender.py"
      - "inbox_control_plane/control_plane.py"
      - "inbox_control_plane/outbound_style_guard.py"
      - "ops/sender_envelope.py"
      - "scripts/affiliate_program_relevance.py"
      - "scripts/affiliate_program_withdrawal.py"
      - "scripts/affiliate_provider_metadata.py"
      - "scripts/affiliate_provider_row_scope.py"
      - "scripts/affiliate_sheet_batch_writer.py"
      - "scripts/affiliate_sheet_schema_guard.py"
      - "scripts/affiliate_terms_fanout.py"
      - "scripts/affiliate_withdrawal_candidate.py"
      - "scripts/glp_deploy_glp34_authority_v1.py"
      - "scripts/glp_sheet_sync_drain.py"
      - "site-system/flagship-v2/work/glp215-accepted-base/scripts/**"
      - "tests/conftest.py"
      - "tests/fixtures/affiliate_terms*"
      - "tests/fixtures/affiliate_terms_registry_validator.mjs"
      - "tests/fixtures/glp331*/**"
      - "tests/fixtures/glp331_native_surface_build.mjs"
      - "tests/fixtures/glp331_provider_identity.mjs"
      - "tests/support/google_stubs.py"
      - "tests/test_affiliate_terms_fanout.py"
      - "tests/test_cleanup_affiliate_decisions.py"
      - "tests/test_glp250_partner_email_hold.py"
      - "tests/test_glp331_program_withdrawal.py"
      - "tests/test_glp331_withdrawal_candidate.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install isolated offline test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5' 'requests==2.32.3' 'PyYAML==6.0.2' 'cryptography==46.0.3'
      - name: Cancellation to removal-candidate contract, exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --version
          PYTHONPATH="$PWD:$PWD/scripts:$PWD/tests" .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp331_program_withdrawal.py tests/test_glp331_withdrawal_candidate.py
      - name: Existing fanout and provider-hold regressions
        run: PYTHONPATH="$PWD:$PWD/scripts:$PWD/tests" .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_affiliate_terms_fanout.py tests/test_glp250_partner_email_hold.py
