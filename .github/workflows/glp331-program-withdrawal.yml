name: glp331-program-withdrawal
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install isolated offline test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5' 'requests==2.32.3' 'PyYAML==6.0.2' 'cryptography==46.0.3'
      - name: Cancellation to removal-candidate contract, exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --version
          PYTHONPATH="$PWD:$PWD/scripts:$PWD/tests" .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp331_program_withdrawal.py tests/test_glp331_withdrawal_candidate.py
      - name: Existing fanout and provider-hold regressions
        run: PYTHONPATH="$PWD:$PWD/scripts:$PWD/tests" .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_affiliate_terms_fanout.py tests/test_glp250_partner_email_hold.py
