name: s1-current-sponsor-receiving
on:
  pull_request:
    paths:
      - 'scripts/glp_sponsor_nuimage_reply.py'
      - 'tests/test_glp_sponsor_nuimage_reply.py'
      - 'scripts/glp_sponsor_campaign.py'
      - 'scripts/glp_sponsor_current_receiving.py'
      - 'tests/test_glp_sponsor_current_receiving.py'
      - '.github/workflows/s1-current-sponsor-receiving.yml'
jobs:
  current-coordinator-exact-head:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pytest google-api-python-client google-auth google-auth-oauthlib python-dotenv
      - name: Exact-head receiving and prior sponsor guard regressions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pytest -q tests/test_glp_sponsor_nuimage_reply.py tests/test_glp_sponsor_current_receiving.py tests/test_glp_sponsor_technical_receiving.py tests/test_glp_sponsor_campaign.py tests/test_glp_sponsor_boundary_repairs.py
