      - "tests/test_glp331_carrier_generation.py"
      - "tests/test_glp331_dependency_closure.py"
      - "tests/test_glp333_reporting_generation.py"
      - "tests/test_glp73_retention_adoption.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-native-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Unchanged public native scheduler fixture dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: izaiahat/hermes-agent
          ref: 07bf28d6446025d3b3b16c758ca4a300ed6db9ba
          path: native-scheduler
          persist-credentials: false
      - name: Isolated runner
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'pytest==8.3.5' 'PyYAML==6.0.2' 'croniter==6.0.0'
      - name: Exact-head, disposable target-specific native CAS and co-pin proof
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GLP_NATIVE_CHECKOUT: ${{ github.workspace }}/native-scheduler
          HERMES_SKIP_ENV_FILE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C native-scheduler rev-parse HEAD)" = 07bf28d6446025d3b3b16c758ca4a300ed6db9ba
          test "$(id -u)" != 0
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_glp331_carrier_closure.py tests/test_fleet_pin_release.py tests/test_glp331_dependency_closure.py
          # Native cron binds its home at import; every outcome gets a fresh interpreter.
          for outcome in ok lost_ack bad_readback second_link alias_unlink; do
            GLP331_NATIVE_CRON_SOURCE="$GLP_NATIVE_CHECKOUT" .venv/bin/python -m pytest -q -p no:cacheprovider "tests/test_glp331_carrier_generation.py::test_unrelated_registry_churn_in_window[$outcome]"
          done
      - name: GLP73 finite two-job retention adoption (native, disposable homes, effect denied)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GLP73_NATIVE_CRON_SOURCE: ${{ github.workspace }}/native-scheduler
          HERMES_SKIP_ENV_FILE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for case in test_successor_accepts_fixed_bytes_but_pr136_and_tampering_refuse test_successor_exact_two_job_native_install_readback test_successor_keeps_review_preimage_and_window_guards test_narrow_preview_reproduces_and_avoids_wrong_cohort test_exact_two_job_native_install_readback test_stale_source_refuses_without_save test_stale_full_job_record_refuses_without_save test_stale_state_refuses_without_save test_precommit_failure_rolls_back_source_and_bytecode 'test_postcommit_uncertainty_seals_and_refuses_replay[save_refused]' 'test_postcommit_uncertainty_seals_and_refuses_replay[lost_save_ack]' 'test_postcommit_uncertainty_seals_and_refuses_replay[bad_readback]' 'test_postcommit_uncertainty_seals_and_refuses_replay[lost_switch_ack]' test_outer_switch_ack_seals_new_ordinary_bytecode; do
            .venv/bin/python -B -m pytest -q -p no:cacheprovider "tests/test_glp73_retention_adoption.py::$case"
          done
