name: maintenance-pause-cursor-race
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maintenance-pause-cursor-race.yml"
      - "ops/n8n-bridge/actions.json"
      - "scripts/glp_current_content_base_schema.py"
      - "scripts/glp_host_ingress.py"
      - "scripts/glp_price_index_weekly.py"
      - "scripts/maintenance_*.py"
      - "scripts/maintenance_admission.py"
      - "scripts/maintenance_cohort.py"
      - "scripts/maintenance_inventory.py"
      - "scripts/maintenance_window.py"
      - "scripts/site_tree_materializer.py"
      - "tests/conftest.py"
      - "tests/fixtures/maintenance*/**"
      - "tests/test_maintenance_admission_review.py"
      - "tests/test_maintenance_native_admission.py"
      - "tests/test_maintenance_pause_cursor_race.py"
      - "tests/test_maintenance_post_pause_completion.py"
      - "tests/test_maintenance_restoration_review.py"
      - "tests/test_maintenance_window.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head-native-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: izaiahat/hermes-agent
          ref: 07bf28d6446025d3b3b16c758ca4a300ed6db9ba
          path: native-scheduler
          persist-credentials: false
      - name: Disposable native fixture dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'pytest==8.3.5' 'PyYAML==6.0.2' 'croniter==6.0.0'
      - name: Exact head, real native tick, effect-denied disposable homes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GLP_NATIVE_CHECKOUT: ${{ github.workspace }}/native-scheduler
          HERMES_SKIP_ENV_FILE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C native-scheduler rev-parse HEAD)" = 07bf28d6446025d3b3b16c758ca4a300ed6db9ba
          test "$(id -u)" != 0
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_maintenance_pause_cursor_race.py tests/test_maintenance_post_pause_completion.py tests/test_maintenance_window.py tests/test_maintenance_restoration_review.py tests/test_maintenance_native_admission.py tests/test_maintenance_admission_review.py
