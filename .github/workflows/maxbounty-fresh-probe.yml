name: maxbounty-fresh-probe
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/maxbounty-fresh-probe.yml"
      - "scripts/glp_awin_portal_login.py"
      - "scripts/glp_maxbounty_capacity_monitor.py"
      - "scripts/glp_maxbounty_fresh_probe.py"
      - "tests/conftest.py"
      - "tests/test_glp_awin_portal_login.py"
      - "tests/test_glp_maxbounty_fresh_probe.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-caller-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install isolated fixture runner
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'pytest==8.3.5'
      - name: Exact fresh producer and real caller (no network)
        run: .venv/bin/python -m pytest -q tests/test_glp_maxbounty_fresh_probe.py
