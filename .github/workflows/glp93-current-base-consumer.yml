name: glp93-current-base-consumer
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/glp93-current-base-consumer.yml"
      - "scripts/glp_affiliate_wire_backlog_worker.py"
      - "scripts/glp_current_content_base_schema.py"
      - "scripts/glp_price_index_weekly.py"
      - "scripts/site_tree_materializer.py"
      - "tests/test_glp93_current_base_consumer.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-current-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact-head offline current-base consumer regression
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -m venv .glp93-venv
          .glp93-venv/bin/python -m pip install 'requests==2.32.3'
          PYTHONDONTWRITEBYTECODE=1 .glp93-venv/bin/python -m unittest discover -s tests -p test_glp93_current_base_consumer.py -v
