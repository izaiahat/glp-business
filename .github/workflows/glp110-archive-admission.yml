name: GLP110 archive admission
on:
  pull_request:
    paths:
      - ".github/workflows/glp110-archive-admission.yml"
      - "ops/disk-retention-policy.json"
      - "scripts/bounded_pruner.py"
      - "scripts/evidence_preserving_pruner.py"
      - "scripts/hermes-state-backup.sh"
      - "scripts/sync_from_repo.py"
      - "tests/conftest.py"
      - "tests/test_bounded_pruner_discovery_resume.py"
      - "tests/test_glp110_archive_admission.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/glp110-archive-admission.yml"
      - "ops/disk-retention-policy.json"
      - "scripts/bounded_pruner.py"
      - "scripts/evidence_preserving_pruner.py"
      - "scripts/hermes-state-backup.sh"
      - "scripts/sync_from_repo.py"
      - "tests/conftest.py"
      - "tests/test_bounded_pruner_discovery_resume.py"
      - "tests/test_glp110_archive_admission.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  effect-denied-owning-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Fresh admission and unchanged safety oracles (fixture only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pytest -q -p no:cacheprovider tests/test_glp110_archive_admission.py tests/test_bounded_pruner_discovery_resume.py
