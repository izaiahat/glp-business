name: GLP110 archive admission
on:
  pull_request:
    paths:
      - scripts/evidence_preserving_pruner.py
      - scripts/bounded_pruner.py
      - tests/test_glp110_archive_admission.py
      - .github/workflows/glp110-archive-admission.yml
  push:
    branches: [main, fix/glp110-fresh-archive-admission]
    paths:
      - scripts/evidence_preserving_pruner.py
      - scripts/bounded_pruner.py
      - tests/test_glp110_archive_admission.py
      - .github/workflows/glp110-archive-admission.yml
permissions:
  contents: read
jobs:
  effect-denied-owning-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Fresh admission and unchanged safety oracles (fixture only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests/test_glp110_archive_admission.py
