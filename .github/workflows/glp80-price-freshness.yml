name: glp80-price-freshness
on:
  pull_request:
    paths:
      - ".github/workflows/glp80-price-freshness.yml"
      - "ops/n8n-bridge/actions.json"
      - "ops/scheduled-source-drift-manifest.json"
      - "scripts/cron_bridge_action.py"
      - "scripts/glp_price_freshness.py"
      - "tests/conftest.py"
      - "tests/fixtures/glp344-price-evidence/**"
      - "tests/test_glp344_price_evidence_delta.py"
      - "tests/test_glp80_price_freshness.py"
      - "tests/test_glp80_registered_price_refresh.py"
      - "tools/glp/evidence_refresh.py"
      - "tools/glp/price_evidence_delta.py"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  price-freshness-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5' 'croniter==6.0.0'
      - run: python -m pytest -q tests/test_glp80_price_freshness.py tests/test_glp344_price_evidence_delta.py tests/test_glp80_registered_price_refresh.py
