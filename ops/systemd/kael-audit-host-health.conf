# Install as /etc/systemd/system/kael-audit.service.d/10-host-health.conf
# Preserve the existing timer; replace ONLY the unsafe legacy LLM/autofix/send producer.
[Service]
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/business
ExecStart=
ExecStart=/usr/bin/python3 /home/ubuntu/business/scripts/host_health_audit.py
TimeoutStartSec=60
MemoryHigh=128M
MemoryMax=256M
CPUQuota=25%
Nice=19
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/ubuntu/business/reports/host-health-audit
RestrictAddressFamilies=AF_UNIX
StandardOutput=journal
StandardError=journal
